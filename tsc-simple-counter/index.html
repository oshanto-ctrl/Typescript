<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Counter App</title>
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <div class="container">
        <h1>Counter</h1>
        
        <div class="counter-display" id="counter-display">
            0
        </div>

        <div class="controls">
            <button id="increment" class="btn btn-increment">+</button>
            <button id="decrement" class="btn btn-decrement">-</button>
            <button id="reset" class="btn btn-reset">R</button>
        </div>
    </div>
    



    <!-- Script Files -->
    <script src="dist/scripts.js"></script>
</body>
</html>
